### model
model_name_or_path: Qwen/Qwen2.5-Coder-7B-Instruct

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: recipes/accelerate_configs/zero3.json

### dataset
dataset: codev_r1_sft_formated
template: qwen
cutoff_len: 3000
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: /root/autodl-tmp/ChipSeek-R1/output/Qwen2.5-Coder-7B-Instruct/sft/full_codev_r1
logging_steps: 10
save_steps: 10000
save_only_model: true
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### eval
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 300

